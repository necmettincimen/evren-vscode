name: SonarQube Cloud

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    env:
      # Settings > Secrets and variables > Actions > SONAR_TOKEN. Yoksa iş atlanır.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Birim testleri + kapsam (lcov)
        if: env.SONAR_TOKEN != ''
        run: npm ci && npm run coverage
      - uses: SonarSource/sonarqube-scan-action@v5
        if: env.SONAR_TOKEN != ''

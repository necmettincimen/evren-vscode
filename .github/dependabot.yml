version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @types/vscode, engines.vscode ile birlikte elle yükseltilir.
      - dependency-name: "@types/vscode"
    commit-message:
      prefix: "bağımlılık"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
